name: Android debug APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sideloadable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://dtlbpkcaojctamelogbv.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable-p-LB4WlqwWuUTgvqSN11Yw_RpgzZqWm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Configure standalone JavaScript bundle for debug APK
        shell: bash
        run: |
          set -euo pipefail
          FILE=android/app/build.gradle
          if ! grep -q 'debuggableVariants = \["debug"\]' "$FILE"; then
            echo "Expected Expo Gradle debuggableVariants setting was not found; refusing to produce a Metro-dependent APK."
            grep -n -A4 -B4 'debuggableVariants' "$FILE" || true
            exit 1
          fi
          sed -i 's/debuggableVariants = \["debug"\]/debuggableVariants = []/' "$FILE"
          grep -n 'debuggableVariants' "$FILE"

      - name: Build standalone debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crush-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
