name: Android debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feat/production-readiness"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sideloadable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://dtlbpkcaojctamelogbv.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_p-LB4WlqwWuUTgvqSN11Yw_RpgzZqWm

    steps:
      - name: Validate Supabase public client configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          case "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "Supabase publishable key must start with sb_publishable_." >&2; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Upload refreshed lockfile for repository sync
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crush-package-lock-refresh
          path: package-lock.json
          retention-days: 1

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Configure standalone JavaScript bundle for debug APK
        shell: bash
        run: |
          set -euo pipefail
          FILE=android/app/build.gradle
          if grep -q '^[[:space:]]*debuggableVariants[[:space:]]*=' "$FILE"; then
            sed -i 's/^[[:space:]]*debuggableVariants[[:space:]]*=.*/    debuggableVariants = []/' "$FILE"
          elif grep -q '^[[:space:]]*\/\/ debuggableVariants' "$FILE"; then
            sed -i '/^[[:space:]]*\/\/ debuggableVariants/a\    debuggableVariants = []' "$FILE"
          else
            echo "Could not locate Expo Gradle debuggableVariants setting."
            exit 1
          fi
          grep -n 'debuggableVariants' "$FILE"
          test "$(grep -c '^[[:space:]]*debuggableVariants[[:space:]]*=' "$FILE")" -eq 1

      - name: Build standalone debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crush-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
