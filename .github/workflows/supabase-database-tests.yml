name: Supabase database tests

on:
  push:
    branches:
      - feat/production-readiness
      - fix/restore-uneswa-student-eligibility
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database-tests.yml"
  pull_request:
    branches:
      - main
      - feat/production-readiness
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Local migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0

      - name: Initialize local configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --force
          fi

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Run database authorization tests
        run: supabase test db

      - name: Stop disposable local Supabase stack
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
