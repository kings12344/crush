name: Refresh dependency lockfile

on:
  push:
    branches:
      - feat/supabase-backend-foundation
    paths:
      - package.json
      - .github/workflows/refresh-dependency-lockfile.yml

permissions:
  contents: write

concurrency:
  group: refresh-dependency-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/supabase-backend-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve and lock pinned dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "Update lockfile for Supabase client"
            git push origin HEAD:feat/supabase-backend-foundation
          fi
